# /ss <player> — put a player into screen-share detainment (or free them if already
# detained; run it again to release). /ss reload reloads this section only.
# Legacy &-color codes here (not MiniMessage) — this feature keeps its own Text
# helper rather than the rest of the plugin's <color:...> tags.
screenshare:
  box:
    # World the detainment boxes are built in. Must already be loaded. REVIEW: pick
    # a world/coordinates for this server before going live — these are placeholders.
    world: world
    base-x: 10000000
    base-y: 100
    base-z: 10000000
    spacing: 64
    interior-size: 5
    cleanup-box: true
  custom-room:
    # Set enabled: true to use a single hand-built room instead of the auto-generated
    # bedrock boxes above — /ss then teleports straight to this fixed spot, skips the
    # box-build/clear entirely, and always uses the item-click GUI (no physical buttons
    # to place). Only one player can be detained at a time in this mode; a second /ss
    # while the room is occupied is refused with messages.room-occupied below.
    enabled: false
    world: world
    x: 0.5
    y: 100
    z: 0.5
    yaw: 0
    pitch: 0
  title:
    fade-in-ticks: 10
    stay-ticks: 12000
    fade-out-ticks: 20
    resend-seconds: 8
    main: "&c&lSCREEN SHARE"
    subtitle: "&fJoin the ScreenShare VC in Discord  -  leaving = ban"
  lockdown:
    gamemode: SURVIVAL
    # Allows detainees to walk around their screen-share room. Generated boxes still
    # prevent leaving the cell; custom rooms have no automatic boundary.
    allow-movement: true
    # Infinite potion effects applied while detained. Format: EFFECT:amplifier
    effects:
      - "SLOWNESS:6"
      - "MINING_FATIGUE:2"
      - "JUMP_BOOST:128"
    block-commands: true
    command-whitelist:
      - "msg"
      - "r"
      - "reply"
      - "helpop"
    escape-attempt-ban: true
  on-quit:
    ban: true
    command: "ban %player% %reason%"
    reason: "Logged out during a screen share"
  rejoin:
    enabled: true
    world: world
    x: 0.5
    y: 100
    z: 0.5
    yaw: 0
    pitch: 0
    message: "&cYou were banned from a screen share. Don't cheat."
  punishments:
    admit:
      command: "ban %player% %reason%"
      reason: "Admitted to cheating during screen share"
    refuse:
      command: "ban %player% %reason%"
      reason: "Refused to screen share"
    escape:
      command: "ban %player% %reason%"
      reason: "Left the screen-share area - counted as refusing to screen share"
  menu:
    # BUTTONS = two clickable buttons (with labelled signs) in the cell wall.
    # CHEST = a forced chest GUI that opens on the screen.
    mode: BUTTONS
    title: "&cScreen Share"
    force-menu: true
    require-confirm: true
    admit:
      slot: 11
      material: RED_CONCRETE
      name: "&c&lAdmit Defeat"
      lore:
        - "&7Confess to cheating."
        - "&7You will be banned."
    refuse:
      slot: 15
      material: GRAY_CONCRETE
      name: "&8&lRefuse Screen Share"
      lore:
        - "&7Decline the screen share."
        - "&7You will be banned."
    confirm:
      title: "&4Are you sure?"
      confirm-slot: 11
      cancel-slot: 15
  messages:
    prefix: "&8[&cSS&8] &r"
    no-permission: "&cYou don't have permission."
    player-not-found: "&cPlayer not found: %player%"
    target-exempt: "&c%player% is exempt from screen share."
    started: "&e%player% &7has been put into screen share."
    released: "&a%player% &7has been released from screen share."
    reloaded: "&aScreenShare config reloaded."
    detained-blocked: "&cYou cannot do that during a screen share."
    usage: "&7Usage: /ss <player> | /ss reload"
    room-occupied: "&cThe screen-share room is already occupied."
